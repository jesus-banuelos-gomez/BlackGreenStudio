<script>
    document.addEventListener('DOMContentLoaded', function () {
        var path = window.location.pathname;
        document.querySelectorAll('.nav-links a').forEach(function (link) {
            var href = link.getAttribute('href');
            if (href === 'blog.html' && (path.includes('blog') || path.endsWith('blog'))) {
                link.classList.add('active');
            }
            if ((href === 'index.html' || href === 'index.html#servicios') && !path.includes('blog')) {
                link.classList.add('active');
            }
        });

        var yearEl = document.getElementById('year');
        if (yearEl) {
            yearEl.textContent = new Date().getFullYear();
        }

        var revealEls = document.querySelectorAll('.reveal');
        if ('IntersectionObserver' in window && window.matchMedia('(prefers-reduced-motion: reduce)').matches === false) {
            var observer = new IntersectionObserver(
                function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                            observer.unobserve(entry.target);
                        }
                    });
                },
                { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
            );
            revealEls.forEach(function (el) {
                observer.observe(el);
            });
        } else {
            revealEls.forEach(function (el) {
                el.classList.add('visible');
            });
        }
    });
</script>
